<div class="flex flex-col items-center justify-center mt-15 p-6 bg-base-100 rounded-2xl">

  <div class="avatar flex flex-col items-center mb-4">
    <div class="ring ring-primary ring-offset-2 ring-offset-base-100 w-24 h-24 rounded-full mb-4">
      <img
        src="https://img.daisyui.com/images/profile/demo/spiderperson@192.webp"
        alt="User Avatar"
        class="rounded-full w-full h-full object-cover"
      />
    </div>
  </div>


  <div class="text-center space-y-3">

    <h2 class="text-2xl font-bold text-base-content">
      {{ showObjUser()?.fullName || 'Usuario' }}
    </h2>


    <div class="flex items-center justify-center gap-2 text-base-content/70">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <span class="text-sm">{{ showObjUser()?.email }}</span>
    </div>


    <div class="flex justify-center">
      <div class="badge badge-lg" [class]="showObjUser()?.isActive ? 'badge-success' : 'badge-error'">
        {{ showObjUser()?.isActive ? 'Activo' : 'Inactivo' }}
      </div>
    </div>


    <div class="flex flex-wrap justify-center gap-2 mt-2">
      <span class="text-xs font-medium text-base-content/60">Roles:</span>
      @for (role of showObjUser()?.roles; track role) {
        <div class="badge badge-outline badge-sm">
          {{ role }}
        </div>
      }
    </div>
  </div>
</div>
